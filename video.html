<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video - Portfolio</title>
    <!-- Tailwind CSS for layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
        }

        /* Apple-like minimalist scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #000;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        /* Reveal animations for scroll */
        .reveal {
            opacity: 0;
            transform: translateY(50px);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Hero text fade in */
        .hero-text {
            animation: fadeUp 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(60px); 
        }
        .hero-text.line-1 { animation-delay: 0.1s; display: inline-block; }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 矢印（↓）用の1.5秒遅延＋上下ゆらゆらアニメーション */
        .scroll-arrow {
            opacity: 0;
            animation: fadeInArrow 1.5s ease forwards 1.5s, bounce 2s infinite 1.5s;
        }

        @keyframes fadeInArrow {
            to { opacity: 0.6; }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        /* PC等（ホバー可能な端末）のみ最初はモノクロでホバー時にカラー */
        @media (hover: hover) and (pointer: fine) {
            .video-img {
                filter: grayscale(100%);
            }
            .group:hover .video-img {
                filter: grayscale(0%);
            }
        }
    </style>
</head>
<body class="antialiased selection:bg-white selection:text-black">

    <!-- Navbar with Back Button -->
    <nav class="fixed top-0 w-full z-50 bg-black/60 backdrop-blur-xl border-b border-white/10 transition-all duration-300" id="navbar">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-sm font-bold tracking-widest text-gray-400 hover:text-white transition-colors flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                BACK TO PORTFOLIO
            </a>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="h-screen flex flex-col justify-center items-center text-center px-4 relative overflow-hidden">
        <h1 class="text-6xl md:text-8xl lg:text-9xl font-extrabold tracking-tighter hero-text line-1">
            Video
        </h1>

        <!-- 1.5秒後に表示される矢印アイコン（↓） -->
        <div class="absolute bottom-12 left-1/2 -translate-x-1/2 z-10">
            <a href="#content" class="scroll-arrow block text-white hover:opacity-100 transition-opacity">
                <svg class="w-8 h-8 md:w-10 md:h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
                </svg>
            </a>
        </div>
        
        <!-- Subtle background gradient blob for depth -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-white/5 rounded-full blur-[120px] -z-10"></div>
    </header>

    <!-- Content Section -->
    <section id="content" class="py-24 px-4 md:px-12 max-w-4xl mx-auto space-y-32">
        
        <!-- Video Item 1 -->
        <div class="reveal group">
            <a href="https://youtu.be/EOBmsRRIRrY" target="_blank" class="block w-full aspect-video rounded-2xl overflow-hidden bg-zinc-900 border border-white/10 mb-6 relative cursor-pointer">
                <!-- classから grayscale 関連を削除し、video-img と loading="lazy" を追加 -->
                <img src="event.webp" alt="Video 1" loading="lazy" class="video-img w-full h-full object-cover transition-all duration-700 group-hover:scale-105">
                <!-- ホバー時のうっすらした紫のグラデーション -->
                <div class="absolute inset-0 bg-gradient-to-t from-purple-500/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                <!-- 再生アイコン（装飾） -->
                <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-500">
                    <div class="w-16 h-16 bg-black/60 rounded-full flex items-center justify-center backdrop-blur-sm border border-white/20">
                        <svg class="w-8 h-8 text-white ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                </div>
            </a>
            <h3 class="text-2xl md:text-3xl font-bold tracking-tight mb-3 transition-colors group-hover:text-purple-400">【学校紹介】尾北高校 球技大会・学校祭</h3>
        </div>

        <!-- Video Item 2 -->
        <div class="reveal group">
            <a href="https://youtu.be/2rEltibEDR8" target="_blank" class="block w-full aspect-video rounded-2xl overflow-hidden bg-zinc-900 border border-white/10 mb-6 relative cursor-pointer">
                <!-- classから grayscale 関連を削除し、video-img と loading="lazy" を追加 -->
                <img src="30s.webp" alt="Video 2" loading="lazy" class="video-img w-full h-full object-cover transition-all duration-700 group-hover:scale-105">
                <!-- ホバー時のうっすらしたシアンのグラデーション -->
                <div class="absolute inset-0 bg-gradient-to-t from-cyan-500/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-500">
                    <div class="w-16 h-16 bg-black/60 rounded-full flex items-center justify-center backdrop-blur-sm border border-white/20">
                        <svg class="w-8 h-8 text-white ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                </div>
            </a>
            <h3 class="text-2xl md:text-3xl font-bold tracking-tight mb-3 transition-colors group-hover:text-cyan-400">【学校紹介】尾北高校紹介動画30秒ver</h3>
        </div>

        <!-- Video Item 3 -->
        <div class="reveal group">
            <a href="https://youtu.be/wVPckafcUcw" target="_blank" class="block w-full aspect-video rounded-2xl overflow-hidden bg-zinc-900 border border-white/10 mb-6 relative cursor-pointer">
                <!-- classから grayscale 関連を削除し、video-img と loading="lazy" を追加 -->
                <img src="sports.webp" alt="Video 3" loading="lazy" class="video-img w-full h-full object-cover transition-all duration-700 group-hover:scale-105">
                <!-- ホバー時のうっすらした緑のグラデーション -->
                <div class="absolute inset-0 bg-gradient-to-t from-green-500/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-500">
                    <div class="w-16 h-16 bg-black/60 rounded-full flex items-center justify-center backdrop-blur-sm border border-white/20">
                        <svg class="w-8 h-8 text-white ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                </div>
            </a>
            <h3 class="text-2xl md:text-3xl font-bold tracking-tight mb-3 transition-colors group-hover:text-green-400">尾北高校 部活動紹介2025</h3>
        </div>

    </section>

    <!-- 問い合わせセクション -->
    <section class="py-32 px-6 bg-zinc-950">
        <div class="max-w-4xl mx-auto text-center reveal">
            <h2 class="text-2xl md:text-4xl font-bold tracking-tighter mb-8 leading-tight">
                より詳しい動画作品については、<br class="md:hidden" />お問い合わせください。
            </h2>
            <a href="mailto:26mv047@st.nuas.ac.jp" class="inline-block border border-white px-8 py-4 rounded-full hover:bg-white hover:text-black transition-colors duration-300 font-bold">
                Get in touch
            </a>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-12 border-t border-white/10 text-center">
        <p class="text-gray-600 text-sm tracking-widest">&copy; 2026 Hotaka Komuro. All Rights Reserved.</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const revealElements = document.querySelectorAll('.reveal');
            
            const revealOptions = {
                threshold: 0.15,
                rootMargin: "0px 0px -50px 0px"
            };

            const revealObserver = new IntersectionObserver(function(entries, observer) {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                    }
                });
            }, revealOptions);

            revealElements.forEach(el => {
                revealObserver.observe(el);
            });

            const navbar = document.getElementById('navbar');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 50) {
                    navbar.classList.add('bg-black/80', 'shadow-lg');
                    navbar.classList.remove('bg-black/60');
                } else {
                    navbar.classList.add('bg-black/60');
                    navbar.classList.remove('bg-black/80', 'shadow-lg');
                }
            });
        });
    </script>
</body>
</html>
